[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bhenet-model"
version = "0.1.0"
description = "Multimodal building-function modelling, training and inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
data = ["h5py>=3.8,<4", "numpy>=1.23,<3"]
test = ["pytest>=7,<10"]

[project.scripts]
bhenet-train = "bhenet.train:main"
bhenet-predict = "bhenet.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bhenet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
